name: ui_component
description: A shared App* UI component in lib/shared/ui, registered in COMPONENTS.md and the ui.dart barrel.
version: 0.1.0
environment:
  mason: ^0.1.0
vars:
  name:
    type: string
    description: Component name without the App prefix (snake_case), e.g. otp_field
    prompt: Component name?
  base:
    type: string
    description: shadcn widget it wraps (e.g. ShadInputOTP), or none
    default: none
    prompt: Base shadcn widget (or none)?
