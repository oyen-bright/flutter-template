name: {{project_name.snakeCase()}}
description: "{{{description}}}"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # state
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  hydrated_bloc: ^11.0.0
  equatable: ^3.0.0
  # di / routing / network
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.2
  dio: ^5.11.1
  # storage
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  # ui (shadcn_ui is ONLY imported inside lib/shared/ui - see AGENTS.md)
  shadcn_ui: ^0.57.4
  flutter_svg: ^2.3.2
  gap: ^3.0.1
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0  # injectable_generator 3.x pins build 4.x
  injectable_generator: ^3.1.3
  flutter_gen_runner: ^5.15.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/png/

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true
